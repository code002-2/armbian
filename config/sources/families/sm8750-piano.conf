# SPDX-License-Identifier: GPL-2.0
#
# Xiaomi Pad 8 Pro (piano) — Qualcomm SM8750P family.
#
# The kernel is the piano mainline tree: vanilla stable plus the device work
# (display/DSI, touch, WiFi/BT, charging, camera), maintained at
# https://github.com/code002-2/linux on the piano-<stable> branch.
declare -g LINUXFAMILY="sm8750-piano"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g ARCH="arm64"
declare -g BOOTENV_FILE="qcom-abl.txt"
enable_extension "image-output-abl"

declare -g KERNELSOURCE="https://github.com/code002-2/linux"

case $BRANCH in
	edge)
		declare -g KERNELBRANCH='branch:piano-7.2.9'
		declare -g KERNEL_MAJOR_MINOR="7.2"
		declare -g LINUXCONFIG="linux-sm8750-piano-edge"
		;;

esac

# Build the kernel with clang/LLVM (KERNEL_COMPILER is scoped to the kernel
# make; exporting CC globally leaks into the image chroot where the headers
# postinst would try to run clang that is not installed there).
declare -g KERNEL_COMPILER="clang"

family_tweaks_bsp() {
	:
}
